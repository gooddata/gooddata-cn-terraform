apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ${k3d_cluster_name}
servers: 1
agents: ${k3d_agents}
kubeAPI:
  host: "${kubeapi_host}"
  hostIP: "0.0.0.0"
  hostPort: "6443"
network: k3d-default
ports:
  - port: "443:443"
    nodeFilters:
      - loadbalancer
  - port: "80:80"
    nodeFilters:
      - loadbalancer
%{ if dockerhub_username != "" && dockerhub_access_token != "" ~}
registries:
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - "https://registry-1.docker.io"
    configs:
      "registry-1.docker.io":
        auth:
          username: "${dockerhub_username}"
          password: "${dockerhub_access_token}"
%{ endif ~}
options:
  k3d:
    wait: true
    timeout: "60s"
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      # The node shares the host disk. Image GC (default at 85% use) and the imagefs/nodefs
      # eviction thresholds delete imported local images and evict pods on busy laptop disks.
      - arg: --kubelet-arg=image-gc-high-threshold=100
        nodeFilters:
          - all
      - arg: --kubelet-arg=image-gc-low-threshold=99
        nodeFilters:
          - all
      - arg: --kubelet-arg=eviction-hard=memory.available<100Mi,nodefs.available<2%,imagefs.available<2%
        nodeFilters:
          - all
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false

